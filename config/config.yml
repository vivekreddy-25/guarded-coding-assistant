models:
  - type: main
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      max_tokens: 800
      temperature: 0.4

  - type: self_check_input
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      max_tokens: 10
      temperature: 0.0

  - type: self_check_output
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      max_tokens: 10
      temperature: 0.0

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
      - check output secrets