# NeMo Guardrails models and active rails.

models:
  - type: main
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      max_tokens: 800
      temperature: 0.4

  - type: self_check_input
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      # Self-checks need only a short, consistent yes/no answer.
      max_tokens: 10
      temperature: 0.0

  - type: self_check_output
    engine: openai
    model: openai/gpt-oss-120b
    parameters:
      base_url: "https://api.groq.com/openai/v1"
      # Keep the output review consistent with the input review.
      max_tokens: 10
      temperature: 0.0

rails:
  input:
    flows:
      - self check input

  output:
    flows:
      - self check output
      - check output secrets